<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>鹈鹕骑自行车 · SVG 动画</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#07131f;}
  #stage{display:block;width:100%;height:100%;}
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet"
     xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#79c6f0"/>
    <stop offset="52%" stop-color="#c6ebff"/>
    <stop offset="100%" stop-color="#eef9ff"/>
  </linearGradient>
  <linearGradient id="sunG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#fff6bf"/><stop offset="100%" stop-color="#ffcc33"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0%" stop-color="#ffe680" stop-opacity="0.85"/>
    <stop offset="100%" stop-color="#ffe680" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#b3ddc3"/><stop offset="100%" stop-color="#93cfa9"/>
  </linearGradient>
  <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#82c793"/><stop offset="100%" stop-color="#5da877"/>
  </linearGradient>
  <linearGradient id="roadG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#5c6673"/><stop offset="100%" stop-color="#2f3742"/>
  </linearGradient>
  <linearGradient id="plume" x1="0.1" y1="0" x2="0.6" y2="1">
    <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#d9e6f2"/>
  </linearGradient>
  <linearGradient id="beakG" x1="0" y1="0" x2="1" y2="0.5">
    <stop offset="0%" stop-color="#ffc233"/><stop offset="100%" stop-color="#ee8a00"/>
  </linearGradient>

  <!-- 可复用图形 -->
  <g id="spokeSet" stroke="#c3cedb" stroke-width="2.4" stroke-linecap="round">
    <line x1="-49" y1="0" x2="49" y2="0"/>
    <line x1="0" y1="-49" x2="0" y2="49"/>
    <line x1="-34.6" y1="-34.6" x2="34.6" y2="34.6"/>
    <line x1="-34.6" y1="34.6" x2="34.6" y2="-34.6"/>
    <circle cx="0" cy="-49" r="4.2" fill="#ff8f1f" stroke="none"/>
  </g>

  <g id="cloudTile" fill="#ffffff" opacity="0.9">
    <ellipse cx="140" cy="92" rx="48" ry="26"/>
    <ellipse cx="182" cy="84" rx="34" ry="21"/>
    <ellipse cx="102" cy="100" rx="30" ry="18"/>
    <ellipse cx="452" cy="58" rx="40" ry="23"/>
    <ellipse cx="492" cy="53" rx="26" ry="16"/>
    <ellipse cx="702" cy="122" rx="44" ry="25"/>
    <ellipse cx="742" cy="116" rx="28" ry="17"/>
  </g>

  <g id="hillFarTile">
    <path fill="url(#hillFar)" d="M0,392 C70,340 150,345 220,390 C280,428 350,420 410,392
      C480,358 560,352 630,388 C700,424 760,415 800,395 L800,423 L0,423 Z"/>
  </g>

  <g id="hillNearTile">
    <path fill="url(#hillNear)" d="M0,412 C90,374 170,378 240,406 C310,434 390,430 450,404
      C520,372 610,368 680,396 C740,420 780,417 800,410 L800,423 L0,423 Z"/>
  </g>

  <g id="roadDashTile">
    <rect x="20"  y="458" width="72" height="9" rx="4.5" fill="#ffd84d" opacity="0.9"/>
    <rect x="180" y="458" width="72" height="9" rx="4.5" fill="#ffd84d" opacity="0.9"/>
    <rect x="340" y="458" width="72" height="9" rx="4.5" fill="#ffd84d" opacity="0.9"/>
    <rect x="500" y="458" width="72" height="9" rx="4.5" fill="#ffd84d" opacity="0.9"/>
    <rect x="660" y="458" width="72" height="9" rx="4.5" fill="#ffd84d" opacity="0.9"/>
  </g>
</defs>

<!-- ================= 背景 ================= -->
<rect width="800" height="500" fill="url(#sky)"/>
<circle cx="128" cy="96" r="116" fill="url(#glow)"/>
<circle cx="128" cy="96" r="44" fill="url(#sunG)"/>

<g id="cloudStrip">
  <use xlink:href="#cloudTile" href="#cloudTile"/>
  <use xlink:href="#cloudTile" href="#cloudTile" x="800"/>
</g>

<g id="hillsFarStrip">
  <use xlink:href="#hillFarTile" href="#hillFarTile"/>
  <use xlink:href="#hillFarTile" href="#hillFarTile" x="800"/>
</g>
<g id="hillNearStrip">
  <use xlink:href="#hillNearTile" href="#hillNearTile"/>
  <use xlink:href="#hillNearTile" href="#hillNearTile" x="800"/>
</g>

<!-- ================= 路面 ================= -->
<rect x="0" y="423" width="800" height="77" fill="url(#roadG)"/>
<rect x="0" y="423" width="800" height="4" fill="#93a1b3" opacity="0.5"/>
<g id="roadDashStrip" opacity="0.85">
  <use xlink:href="#roadDashTile" href="#roadDashTile"/>
  <use xlink:href="#roadDashTile" href="#roadDashTile" x="800"/>
</g>

<!-- ================= 主车体 ================= -->
<g id="rig">

  <!-- 轮子 -->
  <g>
    <circle cx="270" cy="365" r="58" fill="none" stroke="#1f2937" stroke-width="10"/>
    <circle cx="270" cy="365" r="50" fill="none" stroke="#b9c4d0" stroke-width="3"/>
    <g id="hubRear" transform="translate(270 365)"><use xlink:href="#spokeSet" href="#spokeSet"/></g>
    <circle cx="270" cy="365" r="7" fill="#374151"/>
  </g>
  <g>
    <circle cx="560" cy="365" r="58" fill="none" stroke="#1f2937" stroke-width="10"/>
    <circle cx="560" cy="365" r="50" fill="none" stroke="#b9c4d0" stroke-width="3"/>
    <g id="hubFront" transform="translate(560 365)"><use xlink:href="#spokeSet" href="#spokeSet"/></g>
    <circle cx="560" cy="365" r="7" fill="#374151"/>
  </g>

  <!-- 远侧曲柄 + 远侧腿（在车架之后） -->
  <line id="armFar" x1="410" y1="378" x2="410" y2="412" stroke="#8d99a8" stroke-width="6" stroke-linecap="round"/>
  <g id="pedalFar"><rect x="-13" y="-4.5" width="26" height="9" rx="4" fill="#1f2937"/></g>
  <g id="legFar">
    <path id="legFarPath" d="M354 242 L400 300 L410 412" fill="none" stroke="#d98b12"
          stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <circle id="kneeFar" cx="400" cy="300" r="6" fill="#c47c0d"/>
    <ellipse id="footFar" cx="410" cy="408" rx="14" ry="5" fill="#c47c0d"/>
  </g>

  <!-- 车架 -->
  <g stroke="#e63946" stroke-width="9" stroke-linecap="round" fill="none">
    <line x1="270" y1="365" x2="410" y2="378"/>
    <line x1="270" y1="365" x2="368" y2="268"/>
    <line x1="410" y1="378" x2="368" y2="268"/>
    <line x1="368" y1="268" x2="520" y2="258"/>
    <line x1="410" y1="378" x2="520" y2="258"/>
  </g>
  <g stroke="#8a94a6" stroke-width="2.6" stroke-dasharray="5 4" fill="none" opacity="0.9">
    <path d="M270 353 L410 366"/>
    <path d="M270 377 L410 390"/>
  </g>
  <circle cx="410" cy="378" r="17" fill="none" stroke="#aab4c2" stroke-width="3"/>
  <circle cx="270" cy="365" r="11" fill="none" stroke="#aab4c2" stroke-width="3"/>
  <line x1="516" y1="250" x2="524" y2="268" stroke="#c1121f" stroke-width="13" stroke-linecap="round"/>
  <line x1="524" y1="268" x2="560" y2="365" stroke="#4b5563" stroke-width="8" stroke-linecap="round"/>
  <!-- 车把 -->
  <line x1="518" y1="256" x2="528" y2="238" stroke="#374151" stroke-width="8" stroke-linecap="round"/>
  <path d="M528 238 Q 548 232 556 246" fill="none" stroke="#374151" stroke-width="7" stroke-linecap="round"/>
  <circle cx="556" cy="246" r="7.5" fill="#111827"/>
  <!-- 座垫 -->
  <path d="M330 262 q 36 -12 66 -3 q 7 10 -6 15 q -34 7 -60 -2 z" fill="#1f2937"/>

  <!-- ============ 鹈鹕 ============ -->
  <g id="pelican">
    <!-- 远侧翅膀 -->
    <g id="farWing">
      <path d="M382 172 C 410 158 434 166 452 186 C 462 198 456 210 444 208
               C 424 205 400 190 382 172 Z" fill="#dbe6f1" stroke="#bfcddd" stroke-width="2"/>
    </g>

    <!-- 尾羽 -->
    <path d="M268 188 C 240 176 216 178 200 190 C 226 196 244 204 258 214 Z" fill="#e4edf6"/>
    <path d="M272 206 C 246 202 224 208 210 220 C 236 222 254 224 268 226 Z" fill="#dbe6f1"/>

    <!-- 身体 -->
    <ellipse cx="330" cy="202" rx="78" ry="58" fill="url(#plume)"/>
    <ellipse cx="318" cy="228" rx="58" ry="26" fill="#e6eff8" opacity="0.85"/>
    <ellipse cx="352" cy="182" rx="40" ry="24" fill="#ffffff" opacity="0.7"/>

    <!-- 脖子 -->
    <path d="M352 192 C 388 160 414 142 452 132" fill="none" stroke="url(#plume)"
          stroke-width="46" stroke-linecap="round"/>
    <path d="M352 192 C 388 160 414 142 452 132" fill="none" stroke="#dbe6f1"
          stroke-width="46" stroke-linecap="round" opacity="0.35" transform="translate(4 6)"/>

    <!-- 围巾 -->
    <path id="scarf" d="M438 158 L410 160 L382 166 L354 176 L330 188" fill="none"
          stroke="#e63946" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M436 152 q 22 4 22 16 q 0 12 -22 14 q -18 -14 0 -30 z" fill="#ff5964"/>

    <!-- 头 -->
    <circle cx="462" cy="124" r="31" fill="#ffffff"/>
    <path d="M446 98 q -8 -22 10 -30 q 4 16 16 22 z" fill="#eef4fa"/>

    <!-- 喙（上颚） -->
    <path d="M482 110 C 542 104 592 112 630 126 C 598 136 540 132 480 130 Z"
          fill="url(#beakG)" stroke="#d97706" stroke-width="1.5"/>
    <!-- 喉囊 -->
    <path d="M480 126 C 520 154 578 158 628 128 C 610 178 542 190 498 166
             C 484 158 477 142 480 126 Z" fill="#ffd166" stroke="#e5a50a" stroke-width="2"/>
    <path d="M500 140 C 530 158 570 162 604 148" fill="none" stroke="#e5a50a"
          stroke-width="2" opacity="0.7"/>
    <circle cx="478" cy="112" r="5.6" fill="#1f2937"/>
    <circle cx="480" cy="110" r="1.9" fill="#ffffff"/>
    <path d="M500 118 L516 120" stroke="#c97b06" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <!-- 近侧翅膀（握车把） -->
    <path id="wingNear" d="M376 166 C 424 174 482 202 528 238 C 540 247 536 261 521 256
             C 500 249 468 234 440 219 C 408 202 384 193 366 190 Z"
          fill="#f8fbff" stroke="#cbd8e6" stroke-width="2.5"/>
    <path d="M404 192 C 440 206 478 226 508 246" fill="none" stroke="#dbe6f1" stroke-width="2.5"/>
    <path d="M392 182 C 430 194 470 214 502 236" fill="none" stroke="#dbe6f1" stroke-width="2.5"/>
  </g>

  <!-- 近侧曲柄 + 近侧腿（在车架之前） -->
  <line id="armNear" x1="410" y1="378" x2="410" y2="344" stroke="#c3cedb" stroke-width="7" stroke-linecap="round"/>
  <g id="pedalNear"><rect x="-13" y="-4.5" width="26" height="9" rx="4" fill="#111827"/></g>
  <g id="legNear">
    <path id="legNearPath" d="M370 250 L410 300 L410 344" fill="none" stroke="#f6a723"
          stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <circle id="kneeNear" cx="410" cy="300" r="7" fill="#e08e0b"/>
    <ellipse id="footNear" cx="410" cy="340" rx="16" ry="5.5" fill="#e08e0b"/>
  </g>

</g>

<!-- ================= 前景风线 ================= -->
<g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.45">
  <line x1="70" y1="300" x2="150" y2="300">
    <animate attributeName="x1" values="120;20" dur="0.9s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="200;100" dur="0.9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.5;0" dur="0.9s" repeatCount="indefinite"/>
  </line>
  <line x1="600" y1="180" x2="660" y2="180">
    <animate attributeName="x1" values="660;580" dur="1.2s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="720;640" dur="1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.45;0" dur="1.2s" repeatCount="indefinite"/>
  </line>
  <line x1="620" y1="330" x2="700" y2="330">
    <animate attributeName="x1" values="700;600" dur="1.1s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="780;680" dur="1.1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.4;0" dur="1.1s" repeatCount="indefinite"/>
  </line>
</g>

</svg>

<script>
(function () {
  var SVGNS = "http://www.w3.org/2000/svg";
  var RAD = Math.PI / 180;
  var el = function (id) { return document.getElementById(id); };

  var BB = { x: 410, y: 378 };      // 中轴
  var CR = 34;                      // 曲柄长度
  var THIGH = 92, SHIN = 104;       // 大腿 / 小腿
  var HIP_FAR  = { x: 354, y: 240 };
  var HIP_NEAR = { x: 372, y: 250 };

  var t = 0, last = performance.now();
  var wheelDeg = 0, crankDeg = 0, groundX = 0, cloudX = 0, hillX = 0;

  // 两骨骼 IK：给定髋与踏板，解出膝盖位置（膝盖朝前）
  function ik(hip, pedal) {
    var dx = pedal.x - hip.x, dy = pedal.y - hip.y;
    var d = Math.sqrt(dx * dx + dy * dy) || 1e-6;
    var maxD = (THIGH + SHIN) * 0.995;
    if (d > maxD) { var s = maxD / d; dx *= s; dy *= s; d = maxD; }
    var a = (THIGH * THIGH - SHIN * SHIN + d * d) / (2 * d);
    var h = Math.sqrt(Math.max(0, THIGH * THIGH - a * a));
    var ux = dx / d, uy = dy / d;
    return {
      kx: hip.x + ux * a + uy * h,
      ky: hip.y + uy * a - ux * h,
      fx: hip.x + dx,
      fy: hip.y + dy
    };
  }

  var legFar = el("legFarPath"), legNear = el("legNearPath");
  var kneeFar = el("kneeFar"), kneeNear = el("kneeNear");
  var footFar = el("footFar"), footNear = el("footNear");
  var armFar = el("armFar"), armNear = el("armNear");
  var pedalFar = el("pedalFar"), pedalNear = el("pedalNear");
  var hubRear = el("hubRear"), hubFront = el("hubFront");
  var rig = el("rig"), scarf = el("scarf"), farWing = el("farWing");
  var cloudStrip = el("cloudStrip"), hillsFarStrip = el("hillsFarStrip");
  var hillNearStrip = el("hillNearStrip"), roadDashStrip = el("roadDashStrip");
  var pelican = el("pelican");

  function setLeg(path, knee, foot, hip, p) {
    path.setAttribute("d",
      "M" + hip.x + " " + hip.y + " L" + p.kx.toFixed(1) + " " + p.ky.toFixed(1) +
      " L" + p.fx.toFixed(1) + " " + p.fy.toFixed(1));
    knee.setAttribute("cx", p.kx.toFixed(1));
    knee.setAttribute("cy", p.ky.toFixed(1));
    foot.setAttribute("cx", p.fx.toFixed(1));
    foot.setAttribute("cy", (p.fy - 3.5).toFixed(1));
  }

  function loop(now) {
    var dt = (now - last) / 1000;
    last = now;
    if (dt > 0.06) dt = 0.06;
    if (dt < 0) dt = 0;
    t += dt;

    var wheelSpeed = 175;                       // 度/秒
    wheelDeg = (wheelDeg + wheelSpeed * dt) % 360;
    crankDeg = (crankDeg + 205 * dt) % 360;

    var vGround = wheelSpeed * RAD * 58;        // 与轮径匹配的位移速度
    groundX = (groundX + vGround * dt) % 800;
    cloudX = (cloudX + 16 * dt) % 800;
    hillX = (hillX + 58 * dt) % 800;

    hubRear.setAttribute("transform", "translate(270 365) rotate(" + wheelDeg.toFixed(2) + ")");
    hubFront.setAttribute("transform", "translate(560 365) rotate(" + wheelDeg.toFixed(2) + ")");
    roadDashStrip.setAttribute("transform", "translate(" + (-groundX).toFixed(2) + " 0)");
    hillNearStrip.setAttribute("transform", "translate(" + (-hillX).toFixed(2) + " 0)");
    hillsFarStrip.setAttribute("transform", "translate(" + (-hillX * 0.55).toFixed(2) + " 0)");
    cloudStrip.setAttribute("transform", "translate(" + (-cloudX).toFixed(2) + " 0)");

    // 车身颠簸
    var bob = Math.sin(t * 7.4) * 1.9 + Math.sin(t * 14.8) * 0.7;
    rig.setAttribute("transform", "translate(0 " + bob.toFixed(2) + ")");

    // 曲柄 / 踏板
    var ang = crankDeg * RAD;
    var px = BB.x + CR * Math.cos(ang), py = BB.y + CR * Math.sin(ang);
    var fx = BB.x - CR * Math.cos(ang), fy = BB.y - CR * Math.sin(ang);

    armNear.setAttribute("x1", BB.x); armNear.setAttribute("y1", BB.y);
    armNear.setAttribute("x2", px.toFixed(1)); armNear.setAttribute("y2", py.toFixed(1));
    armFar.setAttribute("x1", BB.x); armFar.setAttribute("y1", BB.y);
    armFar.setAttribute("x2", fx.toFixed(1)); armFar.setAttribute("y2", fy.toFixed(1));
    pedalNear.setAttribute("transform", "translate(" + px.toFixed(1) + " " + py.toFixed(1) + ")");
    pedalFar.setAttribute("transform", "translate(" + fx.toFixed(1) + " " + fy.toFixed(1) + ")");

    // 双腿
    var kFar = ik(HIP_FAR, { x: fx, y: fy });
    var kNear = ik(HIP_NEAR, { x: px, y: py });
    setLeg(legFar, kneeFar, footFar, HIP_FAR, kFar);
    setLeg(legNear, kneeNear, footNear, HIP_NEAR, kNear);

    // 头部/脖子摆动
    pelican.setAttribute("transform",
      "rotate(" + (Math.sin(t * 7.4 + 0.7) * 2.6).toFixed(2) + " 400 196)");

    // 远侧翅膀扇动
    farWing.setAttribute("transform",
      "rotate(" + (Math.sin(t * 5.2) * 9 - 3).toFixed(2) + " 388 178)");

    // 围巾飘动
    var d = "M438 158";
    for (var i = 1; i <= 6; i++) {
      var sx = 438 - i * 24;
      var sy = 158 + i * 4 + Math.sin(t * 9 - i * 0.85) * (4 + i * 1.6);
      d += " L" + sx.toFixed(1) + " " + sy.toFixed(1);
    }
    scarf.setAttribute("d", d);

    requestAnimationFrame(loop);
  }

  document.addEventListener("visibilitychange", function () {
    last = performance.now();
  });

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
